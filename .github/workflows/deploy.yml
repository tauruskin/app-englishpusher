name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Recorded word pronunciation (specs/002-word-audio): voice new words, drop deleted ones.
      # Never fails the deploy; words without a recording use the device voice.
      - name: Generate word audio
        run: node scripts/generate-audio.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Commit new audio
        run: |
          if [ -z "$(git status --porcelain public/audio)" ]; then
            echo "No audio changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          git commit -m "Audio: update word recordings [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main \
            || echo "::warning::Could not push new audio; the next deploy will make it again."

      - run: echo "VITE_BASE_PATH=/" >> $GITHUB_ENV

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          cname: app.englishpusher.in.ua
